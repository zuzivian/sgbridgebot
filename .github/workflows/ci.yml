name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
          pip install ruff flake8 mypy pytest

      - name: Run ruff (minimal low-signal rules)
        run: |
          mkdir -p artifacts
          ruff check sgbridgebot tests | tee artifacts/ruff.txt

      - name: Run flake8 (minimal low-signal rules)
        run: |
          mkdir -p artifacts
          flake8 sgbridgebot tests | tee artifacts/flake8.txt

      - name: Run mypy (optional)
        continue-on-error: true
        run: |
          mkdir -p artifacts
          mypy sgbridgebot --ignore-missing-imports | tee artifacts/mypy.txt

      - name: Upload lint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-py${{ matrix.python-version }}-attempt${{ github.run_attempt }}
          path: artifacts/

      - name: Validate workflow YAML parsing
        run: |
          python - <<'PY'
          import yaml
          with open('.github/workflows/ci.yml', 'r', encoding='utf-8') as f:
              yaml.safe_load(f)
          print('Workflow YAML parsed successfully')
          PY

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint with ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -q

  packaging-smoke:
    name: Packaging/import smoke (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Import smoke test
        run: |
          python - <<'PY'
          import sgbridgebot
          import sgbridgebot.main
          print('Smoke import successful')
          PY
