name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, and tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check sgbridgebot/ChatBot.py sgbridgebot/ChatHandler.py sgbridgebot/BridgeGame.py sgbridgebot/CommandUtils.py tests

      - name: Mypy type check
        run: mypy

      - name: Pytest
        run: pytest -q

  packaging-smoke:
    name: Packaging/import smoke (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Packaging and import smoke test
        run: |
          python setup.py sdist bdist_wheel
          python - <<'PY'
          import sgbridgebot
          print(sgbridgebot.__version__)
          PY
