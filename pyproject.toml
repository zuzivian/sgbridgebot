[tool.ruff]
line-length = 100
fix = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
  "E501",  # handled incrementally in legacy modules
  "UP004", # keep explicit inheritance changes out of this batch
  "UP009", # allow legacy coding comment cleanup in later batches
  "UP025", # allow existing unicode literal style for now
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.mypy]
python_version = "3.10"
files = [
  "sgbridgebot/ChatBot.py",
  "sgbridgebot/ChatHandler.py",
  "sgbridgebot/BridgeGame.py",
  "sgbridgebot/CommandUtils.py",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
