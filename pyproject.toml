[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
  "E203",
  "E402",
  "UP025",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B017", "E501", "I001"]

[tool.mypy]
python_version = "3.10"
files = ["sgbridgebot/ChatBot.py", "sgbridgebot/ChatHandler.py", "sgbridgebot/BridgeGame.py", "sgbridgebot/CommandUtils.py"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
